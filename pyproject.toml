[project]
name = "cairn-tooling"
version = "1.7.2"
description = "Development tooling for the cairn plugin (host build and version script)"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["core/tools"]
testpaths = ["tests"]
