name: Bug report
description: A skill or agent misbehaved. The three required facts are what a cairn bug cannot be reproduced without.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: dropdown
    id: host
    attributes:
      label: Host
      description: The host you run cairn under, named by its definition directory under `scripts/hosts/` — `claude` is Claude Code (installed from `cairn-claude`), `antigravity` is Antigravity (installed from `cairn-antigravity`).
      options:
        - claude
        - antigravity
    validations:
      required: true
  - type: input
    id: cairn-version
    attributes:
      label: Cairn version
      description: The release you have installed — the `version` field of the plugin manifest (`.claude-plugin/plugin.json` in the installed plugin on Claude Code, `.agents/plugins/cairn/plugin.json` on Antigravity), or the release tag you extracted.
      placeholder: MAJOR.MINOR.PATCH
    validations:
      required: true
  - type: input
    id: skill-invoked
    attributes:
      label: Skill invoked
      description: The slash command you ran when the bug appeared, with its argument if it took one.
      placeholder: "/answer-open-question Short Title. the answer"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected the skill to do, what it did instead, and the console output or file state that shows the difference.
    validations:
      required: true
  - type: textarea
    id: how-to-reproduce
    attributes:
      label: How to reproduce
      description: The milestone state and the sequence of skills that lead to it, if you can reproduce it — a `requirements.md` excerpt, a task section, or the commands run in order.
    validations:
      required: false
