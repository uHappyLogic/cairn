# Host definition: Codex.
#
# A host is declared to scripts/build_hosts.py by this settings file plus the template
# files beside it under scripts/hosts/<host>/. The build discovers hosts by scanning that
# directory, renders core/ through these settings into hosts/<host>/, and renders every
# other file in this directory as a template to the same relative path in that tree, with
# its {{VERSION}} slot filled from the root VERSION file and its {{NAME}} slot from
# plugin_name below. Every host shares this exact key set: a key with nothing to declare
# is left empty, never omitted.

# The plugin name that fills every {{NAME}} slot in the templates beside this file.
plugin_name = "cairn"

# The literal that replaces every {{PLUGIN_ROOT}} placeholder in the rendered core/ files.
# Codex resolves this runtime variable to the installed plugin's root directory.
plugin_root = "${PLUGIN_ROOT}"

# The path from this host tree's root to the directory plugin_root stands for at runtime,
# empty when that directory is the tree root. The dangling-plugin-root check resolves every
# plugin-root reference against it rather than the tree root, and every [layout] value must
# lie inside it; [layout], renames, and template paths stay relative to the tree root.
# This tree is a Codex marketplace whose .agents/plugins/marketplace.json points at the one
# plugin below its root, so that directory is plugins/cairn.
plugin_dir = "plugins/cairn"

# Regular expressions whose every match is deleted from each rendered core/ text file.
prose_drop_patterns = []

# YAML frontmatter keys removed from every rendered skill and agent file. Only Claude Code
# reads the agents' `color` key, so this tree carries none.
strip_frontmatter_keys = ["color"]

# Individual files moved after the layout below is applied: each `from` path, relative to
# the host tree root, is written at its `to` path instead.
renames = []

# Paths relative to core/ (files or whole directories) left out of this host's tree.
exclude = []

# Where each top-level directory of core/ lands, relative to the host tree root. Every
# top-level directory of core/ must appear here.
[layout]
skills = "plugins/cairn/skills"
agents = "plugins/cairn/agents"
shared = "plugins/cairn/shared"
tools = "plugins/cairn/tools"

# This host's text for every named slot, keyed by slot name: each {{SLOT_NAME}} placeholder
# in a rendered core/ text file is replaced by its value here, before {{PLUGIN_ROOT}} is
# replaced, so a value may carry {{PLUGIN_ROOT}}. Every host declares the same slot names,
# and every name declared must appear in core/.
[slots]
# CONTEXT_FILE: the project's environment-context file, which the skills read for the
# project's context, the bootstrap creates or extends, and finish-current-milestone updates.
# Codex reads its project instructions from AGENTS.md (its /init writes that file), so the
# workflow reads and writes its environment context there and never touches CLAUDE.md.
CONTEXT_FILE = "AGENTS.md"
# COMPLETE_TASK_DISPATCH: the complete-all-tasks sentence telling the runner how to dispatch
# the complete-task agent for one task, ending where the dispatch prompt's fenced block opens.
# Codex registers no plugin-shipped agent, so the runner spawns its default (generic)
# subagent and points it at the plugin's agent file by its plugin-root path.
COMPLETE_TASK_DISPATCH = '''Use the `spawn_agent` tool to spawn one default (generic) subagent, with no custom agent type, and a prompt that tells it to read and follow the plugin's `complete-task` agent file at `{{PLUGIN_ROOT}}/agents/complete-task.md` and otherwise contains only the task name, substituting `<TASK_NAME>` with the exact `##` heading text (without the `##` prefix):'''
# COMPLETE_TASK_PROMPT_INSTRUCTIONS: text opening complete-all-tasks' dispatch prompt, before
# the task-name line.
# The generic subagent has no other way to learn its instructions, so the prompt opens with
# the agent file's plugin-root path.
COMPLETE_TASK_PROMPT_INSTRUCTIONS = "Read and follow the agent instructions in {{PLUGIN_ROOT}}/agents/complete-task.md.\n\n"
# ALTERNATIVES_DISPATCH: the provide-alternatives-to-all-open-questions paragraph telling the
# runner how to dispatch the per-question provide-alternatives-to-open-question agent and
# what its prompt carries, ending where the dispatch prompt's fenced block opens.
# Codex registers no plugin-shipped agent, so the runner spawns its default (generic)
# subagent and points it at the plugin's agent file by its plugin-root path.
ALTERNATIVES_DISPATCH = '''Use the `spawn_agent` tool to spawn one default (generic) subagent per surviving question,
with no custom agent type, and have it act as the plugin's
`provide-alternatives-to-open-question` agent (singular — the per-question subagent) by reading
and following that agent's file, `{{PLUGIN_ROOT}}/agents/provide-alternatives-to-open-question.md`.
Pass it that file's path, that question's **Short Title**, and the `<MILESTONE_DIR>` resolved in
step 0, and nothing else — the path, which the subagent has no other way to learn, and the two
values the orchestrator already holds:'''
# ALTERNATIVES_PROMPT_INSTRUCTIONS: text opening the alternatives pass's dispatch prompt,
# before its first line.
# The generic subagent has no other way to learn its instructions, so the prompt opens with
# the agent file's plugin-root path.
ALTERNATIVES_PROMPT_INSTRUCTIONS = "Read and follow the agent instructions in {{PLUGIN_ROOT}}/agents/provide-alternatives-to-open-question.md.\n\n"
# ALTERNATIVES_AGENT: what the alternatives pass's re-dispatch repair spawns afresh.
# Here that is another default subagent, given the same prompt and so the same agent file.
ALTERNATIVES_AGENT = 'default (generic) subagent'
# AGENT_TOOL: the tool the alternatives pass's repair branches name, both as the source of
# the agent id a follow-up message is addressed to and as the tool a fresh agent is
# dispatched with.
# Here that is the spawn_agent tool, which spawns Codex's subagents.
AGENT_TOOL = '`spawn_agent` tool'
# ALTERNATIVES_CONCURRENCY: the provide-alternatives-to-all-open-questions paragraph opening
# step 3, saying how many per-question dispatches run at once and how the run proceeds through
# them.
# Codex caps the subagent threads a session holds open at once, so the runner keeps at most
# that cap in flight (the agents.max_threads setting, or 6, the default its documentation gave
# when unset), closing each question's agent once its pipeline has finished and dispatching
# the next pending question in its place.
ALTERNATIVES_CONCURRENCY = '''Dispatch one read-only subagent per question step 1b printed, keeping **at most the session's
configured subagent thread cap in flight at once**: the value of the `agents.max_threads` setting
in the session's configuration (also read under its newer name,
`agents.max_concurrent_threads_per_session`), or 6, its default, when the setting is unset.
Dispatch up to that many at once, and run the per-return pipeline below on each return **as it
lands**. As each question's pipeline finishes — its return embedded and committed (sub-step
**d**), or the question skipped, on an explicit failure or after its one repair — close that
question's agent with the `close_agent` tool and dispatch the next pending question, until every
question step 1b printed has been dispatched. An agent is closed only once its pipeline has
finished, never while its repair could still need it, so repair by continuation (sub-step **c**)
still reaches the same agent. No ranking or ordering precedes the dispatches: an alternative set
is enumerated against the sibling questions as scope only, never against how a sibling will
settle, so no dispatch reads what another wrote and their order changes nothing. However many run
at once, the run writes the same blocks and lands the same commits; the cap changes only
wall-clock time.'''
