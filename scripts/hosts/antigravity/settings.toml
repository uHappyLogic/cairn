# Host definition: Antigravity.
#
# A host is declared to scripts/build_hosts.py by this settings file plus the template
# files beside it under scripts/hosts/<host>/. The build discovers hosts by scanning that
# directory, renders core/ through these settings into hosts/<host>/, and renders every
# other file in this directory as a template to the same relative path in that tree, with
# its {{VERSION}} slot filled from the root VERSION file and its {{NAME}} slot from
# plugin_name below. Every host shares this exact key set: a key with nothing to declare
# is left empty, never omitted.
#
# Hands-on check, 2026-10-18, against the installed `agy` 1.4.1 in headless (-p) runs driving
# the plugin's global install at ~/.gemini/config/plugins/cairn, the plugin_root path below,
# with its built-in plugin and customization guides alongside. It confirmed every slot value
# below as written, AGENT_WRITE_TOOLS included, and re-checked each point of the 2026-10-13
# check against `agy` 1.3.4 that this block replaces; what it carried forward unchecked is
# marked so.
# - Install: `agy plugin list` reports the plugin enabled at that global path, source
#   antigravity, with its 22 skills and 2 agents, and a session loads its skills from there.
#   The rendered tilde path reaches the files two ways: run_command's shell expands it, so a
#   `python3 ~/.gemini/config/plugins/cairn/tools/<tool>.py` command runs as written, while
#   view_file refuses the tilde form as not absolute ("must be an absolute path"), and a run
#   following a skill expanded it itself and read the shared procedures at the absolute path.
#   A workspace's own .agents/plugins/ root is loaded beside the global install at session
#   start, its agents dispatchable by bare name, though `agy plugin list` does not show it.
# - Write tools, both agents: an agent file's frontmatter grants its subagent the tools its
#   tools list names and nothing for an enable_write_tools key. On a throwaway agent pair,
#   `enable_write_tools: true` alone left the agent the reading and messaging tools only (it
#   could neither run a command nor write a file), while the tools list AGENT_WRITE_TOOLS
#   carries granted run_command and write_to_file; the plugin's two agents, dispatched by
#   their bare names with their real inputs, each landed the files only those tools produce
#   (the alternatives agent's scratch file; the completion agent's task move with its paths
#   staged). That list is what define_subagent writes for enable_write_tools, as a tools list
#   of the same twelve names, into the conversation's own agents directory, not the install.
# - Dispatch: the plugin's agents load from its agents/ directory with no other file, under
#   their bare frontmatter names (a plugin-namespaced `<plugin>:<agent>` name is refused as
#   not found), and a dispatched agent carries its file's instructions without reading the
#   file. invoke_subagent takes a Subagents array of TypeName, Role, and Prompt entries; two
#   entries in one call started and ran concurrently here (twelve did on 2026-10-13), and the
#   call's result carries each conversation id.
# - Waiting: invoke_subagent has no blocking form; it returns at once (within two seconds,
#   before any agent had ended), and each agent's final message reaches the parent as a
#   message that wakes it, with no polling needed.
# - Continuing an agent: a finished agent stays idle; send_message with that conversation id
#   as Recipient returns at once and resumes the agent with its context intact, its reply
#   arriving as another message (one agent created a file on its first turn and appended to
#   it on the second).
# - Context file: the workspace root AGENTS.md (and GEMINI.md) loaded as workspace rules and
#   CLAUDE.md did not, with no file read by the model. Carried forward from 2026-10-13: /init
#   is no command of this host, a print run passing it to the model as plain text.

# The plugin name that fills every {{NAME}} slot in the templates beside this file.
plugin_name = "cairn"

# The literal that replaces every {{PLUGIN_ROOT}} placeholder in the rendered core/ files.
# Antigravity defines no plugin-root variable for skill text, so references become the fixed
# path of the plugin's global install, written in the tilde form the host's own plugin guide
# uses for where a plugin lives.
plugin_root = "~/.gemini/config/plugins/cairn"

# The path from this host tree's root to the directory plugin_root stands for at runtime,
# empty when that directory is the tree root. The dangling-plugin-root check resolves every
# plugin-root reference against it rather than the tree root, and every [layout] value must
# lie inside it; [layout], renames, and template paths stay relative to the tree root.
# Antigravity loads this whole tree as the plugin, so that directory is the tree root.
plugin_dir = ""

# Regular expressions whose every match is deleted from each rendered core/ text file.
prose_drop_patterns = []

# YAML frontmatter keys removed from every rendered skill and agent file. Only Claude Code
# reads the agents' `color` key, so this tree carries none.
strip_frontmatter_keys = ["color"]

# Frontmatter keys and values every rendered agent file must carry, which the build's
# declared-key-mismatch check confirms. This host grants an agent file's subagent the tools
# its frontmatter tools list names, and the AGENT_WRITE_TOOLS slot writes that list, so the
# same list is declared here and an entry lost or reordered in the slot fails the build.
required_agent_frontmatter = { tools = [
    "send_message", "view_file", "read_url_content", "search_web", "schedule", "generate_image",
    "multi_replace_file_content", "replace_file_content", "write_to_file", "run_command",
    "manage_task", "notebook_edit",
] }

# Individual files moved after the layout below is applied: each `from` path, relative to
# the host tree root, is written at its `to` path instead.
renames = []

# Paths relative to core/ (files or whole directories) left out of this host's tree.
exclude = []

# Where each top-level directory of core/ lands, relative to the host tree root. Every
# top-level directory of core/ must appear here.
[layout]
skills = "skills"
agents = "agents"
shared = "shared"
tools = "tools"

# This host's text for every named slot, keyed by slot name: each {{SLOT_NAME}} placeholder
# in a rendered core/ text file is replaced by its value, before {{PLUGIN_ROOT}} is
# replaced, so a value may carry {{PLUGIN_ROOT}}. Each entry names the file under this
# definition's slots/ subdirectory holding its value; the build removes that file's one
# trailing newline, so a value ending in newlines is held with one more. Every host declares
# the same slot names, and every name declared must appear in core/.
[slots]
# CONTEXT_FILE: the project's environment-context file, which the skills read for the
# project's context, the bootstrap creates or extends, and finish-current-milestone updates.
# This host loads the workspace root AGENTS.md as workspace rules, so the workflow reads and
# writes its environment context there.
CONTEXT_FILE = { file = "slots/CONTEXT_FILE.md" }
# COMPLETE_TASK_DISPATCH: the complete-all-tasks sentence telling the runner how to dispatch
# the complete-task agent for one task, ending where the dispatch prompt's fenced block opens.
# This host loads the plugin's agents natively under their bare names, so the runner names the
# agent as the TypeName of one invoke_subagent entry, whose return arrives as its message.
COMPLETE_TASK_DISPATCH = { file = "slots/COMPLETE_TASK_DISPATCH.md" }
# COMPLETE_TASK_PROMPT_INSTRUCTIONS: text opening complete-all-tasks' dispatch prompt, before
# the task-name line.
# The natively loaded agent already carries its instructions, so nothing precedes the task name.
COMPLETE_TASK_PROMPT_INSTRUCTIONS = { file = "slots/COMPLETE_TASK_PROMPT_INSTRUCTIONS.md" }
# ALTERNATIVES_DISPATCH: the provide-alternatives-to-all-open-questions paragraph telling the
# runner how to dispatch the per-question provide-alternatives-to-open-question agent and
# what its prompt carries, ending where the dispatch prompt's fenced block opens.
# This host loads the plugin's agents natively under their bare names, so each question is one
# invoke_subagent entry naming the agent as its TypeName.
ALTERNATIVES_DISPATCH = { file = "slots/ALTERNATIVES_DISPATCH.md" }
# ALTERNATIVES_PROMPT_INSTRUCTIONS: text opening the alternatives pass's dispatch prompt,
# before its first line.
# The natively loaded agent already carries its instructions, so nothing precedes the prompt.
ALTERNATIVES_PROMPT_INSTRUCTIONS = { file = "slots/ALTERNATIVES_PROMPT_INSTRUCTIONS.md" }
# ALTERNATIVES_PARALLELISM: the phrase in provide-alternatives-to-all-open-questions' opening
# paragraph saying whether the independent per-question dispatches run at the same time.
# One invoke_subagent call starts every entry concurrently, so the phrase states that they run
# together.
ALTERNATIVES_PARALLELISM = { file = "slots/ALTERNATIVES_PARALLELISM.md" }
# ALTERNATIVES_REPAIR: the opening of the alternatives pass's repair sub-step, ahead of its
# fixed corrective message: when the repairs of one batch call's refused files are sent, the
# repair branches this host has (a follow-up to the finished agent, a fresh dispatch, or both),
# and how the run waits on the repaired returns.
# A finished agent waits idle, and send_message addressed to the conversation id
# invoke_subagent returned resumes it with its context intact, so continuation comes first and
# a fresh invoke_subagent dispatch of the agent by its bare name is used only once that id is
# gone. Neither blocks, so repaired returns are batched on the wake-ups their messages bring,
# as the first returns are.
ALTERNATIVES_REPAIR = { file = "slots/ALTERNATIVES_REPAIR.md" }
# ALTERNATIVES_CONCURRENCY: the provide-alternatives-to-all-open-questions paragraph opening
# step 3, saying how many per-question dispatches run at once and how the run collects their
# returns: whether it waits once for every return or batches each time it wakes.
# One invoke_subagent call carries every dispatch, so the wording names no cap. The call never
# blocks and each agent's final message wakes the session, so the run batches each time it
# wakes rather than waiting once.
ALTERNATIVES_CONCURRENCY = { file = "slots/ALTERNATIVES_CONCURRENCY.md" }
# AGENT_WRITE_TOOLS: frontmatter lines added to both agent files, standing at the start of
# the frontmatter's closing line so each line the value carries ends in its own newline and an
# empty value adds no line.
# This host grants an agent file's subagent the tools its frontmatter tools list names, and
# reads no enable_write_tools key there (only its define_subagent tool takes that flag, and
# writes its own grant as a tools list). Both agents write files and run the plugin's tools,
# so the value is the list define_subagent writes for a write-enabled subagent, its reading
# and messaging tools included, which leaves the agents holding the set such a subagent does.
AGENT_WRITE_TOOLS = { file = "slots/AGENT_WRITE_TOOLS.md" }
