# Host definition: Antigravity.
#
# A host is declared to scripts/build_hosts.py by this settings file plus the template
# files beside it under scripts/hosts/<host>/. The build discovers hosts by scanning that
# directory, renders core/ through these settings into hosts/<host>/, and renders every
# other file in this directory as a template to the same relative path in that tree, with
# its {{VERSION}} slot filled from the root VERSION file and its {{NAME}} slot from
# plugin_name below. Every host shares this exact key set: a key with nothing to declare
# is left empty, never omitted.

# The plugin name that fills every {{NAME}} slot in the templates beside this file.
plugin_name = "cairn"

# The literal that replaces every {{PLUGIN_ROOT}} placeholder in the rendered core/ files.
# Antigravity defines no plugin-root variable and loads the plugin from this path relative
# to the consuming workspace root, so references become that workspace-relative literal.
plugin_root = ".agents/plugins/cairn"

# The path from this host tree's root to the directory plugin_root stands for at runtime,
# empty when that directory is the tree root. The dangling-plugin-root check resolves every
# plugin-root reference against it rather than the tree root, and every [layout] value must
# lie inside it; [layout], renames, and template paths stay relative to the tree root.
# Antigravity loads this whole tree as the plugin, so that directory is the tree root.
plugin_dir = ""

# Regular expressions whose every match is deleted from each rendered core/ text file.
prose_drop_patterns = []

# YAML frontmatter keys removed from every rendered skill and agent file. Only Claude Code
# reads the agents' `color` key, so this tree carries none.
strip_frontmatter_keys = ["color"]

# Individual files moved after the layout below is applied: each `from` path, relative to
# the host tree root, is written at its `to` path instead.
renames = []

# Paths relative to core/ (files or whole directories) left out of this host's tree.
exclude = []

# Where each top-level directory of core/ lands, relative to the host tree root. Every
# top-level directory of core/ must appear here.
[layout]
skills = "skills"
agents = "agents"
shared = "shared"
tools = "tools"

# This host's text for every named slot, keyed by slot name: each {{SLOT_NAME}} placeholder
# in a rendered core/ text file is replaced by its value, before {{PLUGIN_ROOT}} is
# replaced, so a value may carry {{PLUGIN_ROOT}}. Each entry names the file under this
# definition's slots/ subdirectory holding its value; the build removes that file's one
# trailing newline, so a value ending in newlines is held with one more. Every host declares
# the same slot names, and every name declared must appear in core/.
[slots]
# CONTEXT_FILE: the project's environment-context file, which the skills read for the
# project's context, the bootstrap creates or extends, and finish-current-milestone updates.
# This tree keeps the project instruction file it has always named, CLAUDE.md.
CONTEXT_FILE = { file = "slots/CONTEXT_FILE.md" }
# COMPLETE_TASK_DISPATCH: the complete-all-tasks sentence telling the runner how to dispatch
# the complete-task agent for one task, ending where the dispatch prompt's fenced block opens.
# This tree keeps the dispatch wording it has always carried.
COMPLETE_TASK_DISPATCH = { file = "slots/COMPLETE_TASK_DISPATCH.md" }
# COMPLETE_TASK_PROMPT_INSTRUCTIONS: text opening complete-all-tasks' dispatch prompt, before
# the task-name line.
# This tree keeps the prompt it has always carried, so nothing precedes the task name.
COMPLETE_TASK_PROMPT_INSTRUCTIONS = { file = "slots/COMPLETE_TASK_PROMPT_INSTRUCTIONS.md" }
# ALTERNATIVES_DISPATCH: the provide-alternatives-to-all-open-questions paragraph telling the
# runner how to dispatch the per-question provide-alternatives-to-open-question agent and
# what its prompt carries, ending where the dispatch prompt's fenced block opens.
# This tree keeps the dispatch wording it has always carried.
ALTERNATIVES_DISPATCH = { file = "slots/ALTERNATIVES_DISPATCH.md" }
# ALTERNATIVES_PROMPT_INSTRUCTIONS: text opening the alternatives pass's dispatch prompt,
# before its first line.
# This tree keeps the prompt it has always carried, so nothing precedes it.
ALTERNATIVES_PROMPT_INSTRUCTIONS = { file = "slots/ALTERNATIVES_PROMPT_INSTRUCTIONS.md" }
# ALTERNATIVES_PARALLELISM: the phrase in provide-alternatives-to-all-open-questions' opening
# paragraph saying whether the independent per-question dispatches run at the same time.
# This tree keeps the wording it has always carried.
ALTERNATIVES_PARALLELISM = { file = "slots/ALTERNATIVES_PARALLELISM.md" }
# ALTERNATIVES_REPAIR: the opening of the alternatives pass's repair sub-step, ahead of its
# fixed corrective message: when the repairs of one batch call's refused files are sent, the
# repair branches this host has (a follow-up to the finished agent, a fresh dispatch, or both),
# and how the run waits on the repaired returns.
# This tree keeps the wording it has always carried, the Agent tool and the namespaced
# registry name included.
ALTERNATIVES_REPAIR = { file = "slots/ALTERNATIVES_REPAIR.md" }
# ALTERNATIVES_CONCURRENCY: the provide-alternatives-to-all-open-questions paragraph opening
# step 3, saying how many per-question dispatches run at once and how the run collects their
# returns: whether it waits once for every return or batches each time it wakes.
# This tree carries the Claude Code value verbatim, naming both wait forms by capability, so the
# runner decides at run time which applies and the two trees stay byte-identical.
ALTERNATIVES_CONCURRENCY = { file = "slots/ALTERNATIVES_CONCURRENCY.md" }
