# Host definition: Claude Code.
#
# A host is declared to scripts/build_hosts.py by this settings file plus the template
# files beside it under scripts/hosts/<host>/. The build discovers hosts by scanning that
# directory, renders core/ through these settings into hosts/<host>/, and renders every
# other file in this directory as a template to the same relative path in that tree, with
# its {{VERSION}} slot filled from the root VERSION file and its {{NAME}} slot from
# plugin_name below. Every host shares this exact key set: a key with nothing to declare
# is left empty, never omitted.
#
# Hands-on check, 2026-10-18, against the installed `claude` 2.1.302 in headless (-p) runs of
# the inline answer sweep, which carries no wording slot, so it re-sourced no value below. It
# carries forward unchecked, and marks so, each point of the 2026-10-13 check against `claude`
# 2.1.296 that this block replaces, which ran with the subagent documentation alongside,
# sourced ALTERNATIVES_CONCURRENCY, ALTERNATIVES_PARALLELISM, and ALTERNATIVES_REPAIR, and
# confirmed CONTEXT_FILE, COMPLETE_TASK_DISPATCH, COMPLETE_TASK_PROMPT_INSTRUCTIONS,
# ALTERNATIVES_DISPATCH, and ALTERNATIVES_PROMPT_INSTRUCTIONS as written.
# - Install: `claude plugin list` reports the plugin enabled at user scope, read from this
#   checkout's hosts/claude through its directory marketplace. A run in a throwaway git
#   project, started as `claude -p "/cairn:answer-all-open-questions-with-recommendation"
#   --dangerously-skip-permissions --model "fable" --effort high`, loaded the skill from there,
#   its text arriving with every ${CLAUDE_PLUGIN_ROOT} already resolved to that directory's
#   absolute path, and the Bash tool ran every call in zsh.
# - Compact view and requirements read: the project's current milestone held two
#   recommendation-bearing blocks, a third whose <depends-on> assumed an option of the first
#   other than its pick, and one recommendation-less block. The runner sent step 1's call,
#   as shown with only <MILESTONE_DIR> replaced, and the whole Read of requirements.md in one
#   turn; the call printed every block's id and question text, then each walked id with its
#   lifted line and its picked alternative's what-it-is line.
# - Batched call: composed exactly as shown, its guard and footer written once and one section
#   per walked id in walk order, the stale block's included, and run as one call that printed
#   `answer commit landed` twice, then `completeness walk` with nothing after it.
# - One commit per answer: two `Recommendation-answer: <Short Title>` commits, each with its
#   lifted line as body, path-scoped to open_questions.xml and requirements.md, each removing
#   its block and adding only its folded decision, one into an existing subsection and one
#   under the subsection its fold created.
# - Silent skip: the first answer's remove stripped the stale block's pick, keeping its
#   alternatives, so that block's section failed its lift and printed and committed nothing.
# - Status line: the run printed only `Recommendations recorded.` and exited 0, the
#   recommendation-less block untouched.
# - Stop after a fold, provoked by hand on the shown call in zsh with a second section whose
#   option names none of its block's alternatives: the fold landed, remove printed its own
#   Error: line, the section printed `stopped at`, a tab, and the Short Title, and the call
#   ended with no completeness walk, the first answer committed and the fold left uncommitted
#   with its block standing. Re-running the shown call printed `dirty before start` and the
#   porcelain line and ended before any lift; a headless run on that tree did the same and
#   reported the dirty start with the porcelain line verbatim and the remedy, changing nothing.
# - Failed lift in the compact view, provoked by hand on the shown call with one walked id's
#   lift sent to a title the document lacks: the tool's Error: line printed in place of the
#   pick, no what-it-is line followed, and the loop went on to the next id.
# - Turns: the clean run took seven, one lost to the runner's own read of the two shared
#   procedures the steps name joined by an `echo ======` separator, which zsh refused as an
#   =cmd expansion; the dirty-start run took five.
# - Dispatch (carried forward from 2026-10-13): the Agent tool takes subagent_type; the
#   plugin's agents are registered under their cairn:-namespaced names with their
#   instructions; several dispatches sent in one message run concurrently, and each call's
#   result carries the agent id.
# - Waiting (carried forward from 2026-10-13): a dispatch runs in the background by default,
#   its call returning at once and the agent's ending waking the session with its final
#   message. A foreground (blocking) form, run_in_background set to false, exists only with
#   fork mode off, which the documentation gives as the headless default and not the
#   interactive one, where the foreground cannot be requested; so the background form is the
#   one wait every session has.
# - Continuing a finished agent (carried forward from 2026-10-13): SendMessage addressed to
#   the agent id resumes the finished agent with its context intact; it never blocks,
#   returning at once, and the resumed agent's ending wakes the session again.
# - Context file (carried forward from 2026-10-13): the session loads the workspace root
#   CLAUDE.md as project instructions.

# The plugin name that fills every {{NAME}} slot in the templates beside this file.
plugin_name = "cairn"

# The literal that replaces every {{PLUGIN_ROOT}} placeholder in the rendered core/ files.
# Claude Code resolves this runtime variable to the installed plugin's root directory.
plugin_root = "${CLAUDE_PLUGIN_ROOT}"

# The path from this host tree's root to the directory plugin_root stands for at runtime,
# empty when that directory is the tree root. The dangling-plugin-root check resolves every
# plugin-root reference against it rather than the tree root, and every [layout] value must
# lie inside it; [layout], renames, and template paths stay relative to the tree root.
# Claude Code installs this whole tree as the plugin, so that directory is the tree root.
plugin_dir = ""

# Regular expressions whose every match is deleted from each rendered core/ text file.
prose_drop_patterns = []

# YAML frontmatter keys removed from every rendered skill and agent file. Claude Code reads
# every key core/ carries, so nothing is stripped.
strip_frontmatter_keys = []

# Frontmatter keys and values every rendered agent file must carry, which the build's
# declared-key-mismatch check confirms. Claude Code needs no frontmatter key to give a plugin
# agent the session's file-writing and shell tools, so nothing is declared.
required_agent_frontmatter = {}

# Individual files moved after the layout below is applied: each `from` path, relative to
# the host tree root, is written at its `to` path instead.
renames = []

# Paths relative to core/ (files or whole directories) left out of this host's tree.
exclude = []

# Where each top-level directory of core/ lands, relative to the host tree root. Every
# top-level directory of core/ must appear here.
[layout]
skills = "skills"
agents = "agents"
shared = "shared"
tools = "tools"

# This host's text for every named slot, keyed by slot name: each {{SLOT_NAME}} placeholder
# in a rendered core/ text file is replaced by its value, before {{PLUGIN_ROOT}} is
# replaced, so a value may carry {{PLUGIN_ROOT}}. Each entry names the file under this
# definition's slots/ subdirectory holding its value; the build removes that file's one
# trailing newline, so a value ending in newlines is held with one more. Every host declares
# the same slot names, and every name declared must appear in core/.
[slots]
# CONTEXT_FILE: the project's environment-context file, which the skills read for the
# project's context, the bootstrap creates or extends, and finish-current-milestone updates.
# Claude Code reads its project instructions from CLAUDE.md, so the workflow reads and
# writes its environment context there.
CONTEXT_FILE = { file = "slots/CONTEXT_FILE.md" }
# COMPLETE_TASK_DISPATCH: the complete-all-tasks sentence telling the runner how to dispatch
# the complete-task agent for one task, ending where the dispatch prompt's fenced block opens.
# Claude Code resolves the agent by its namespaced registry name through the Agent tool.
COMPLETE_TASK_DISPATCH = { file = "slots/COMPLETE_TASK_DISPATCH.md" }
# COMPLETE_TASK_PROMPT_INSTRUCTIONS: text opening complete-all-tasks' dispatch prompt, before
# the task-name line.
# The registered agent already carries its instructions, so nothing precedes the task name.
COMPLETE_TASK_PROMPT_INSTRUCTIONS = { file = "slots/COMPLETE_TASK_PROMPT_INSTRUCTIONS.md" }
# ALTERNATIVES_DISPATCH: the provide-alternatives-to-all-open-questions paragraph telling the
# runner how to dispatch the per-question provide-alternatives-to-open-question agent and
# what its prompt carries, ending where the dispatch prompt's fenced block opens.
# Claude Code resolves the agent by its namespaced registry name through the Agent tool.
ALTERNATIVES_DISPATCH = { file = "slots/ALTERNATIVES_DISPATCH.md" }
# ALTERNATIVES_PROMPT_INSTRUCTIONS: text opening the alternatives pass's dispatch prompt,
# before its first line.
# The registered agent already carries its instructions, so nothing precedes the prompt.
ALTERNATIVES_PROMPT_INSTRUCTIONS = { file = "slots/ALTERNATIVES_PROMPT_INSTRUCTIONS.md" }
# ALTERNATIVES_PARALLELISM: the phrase in provide-alternatives-to-all-open-questions' opening
# paragraph saying whether the independent per-question dispatches run at the same time.
# Claude Code runs every dispatch concurrently, so the phrase states that they run together.
ALTERNATIVES_PARALLELISM = { file = "slots/ALTERNATIVES_PARALLELISM.md" }
# ALTERNATIVES_REPAIR: the opening of the alternatives pass's repair sub-step, ahead of its
# fixed corrective message: when the repairs of one batch call's refused files are sent, the
# repair branches this host has (a follow-up to the finished agent, a fresh dispatch, or both),
# and how the run waits on the repaired returns.
# A follow-up message sent with SendMessage reaches a finished agent by the id the Agent tool
# returned, so continuation comes first and a fresh dispatch, naming the registered agent by
# its namespaced registry name through the Agent tool, is used only once that id is gone.
# Neither blocks, so repaired returns are batched on the wake-ups their endings bring, as the
# first returns are.
ALTERNATIVES_REPAIR = { file = "slots/ALTERNATIVES_REPAIR.md" }
# ALTERNATIVES_CONCURRENCY: the provide-alternatives-to-all-open-questions paragraph opening
# step 3, saying how many per-question dispatches run at once and how the run collects their
# returns: whether it waits once for every return or batches each time it wakes.
# Claude Code sends every dispatch together, so the wording names no cap. Every dispatch runs
# in the background and each agent's ending wakes the session, so the run batches each time it
# wakes rather than waiting once.
ALTERNATIVES_CONCURRENCY = { file = "slots/ALTERNATIVES_CONCURRENCY.md" }
# AGENT_WRITE_TOOLS: frontmatter lines added to both agent files, standing at the start of
# the frontmatter's closing line so each line the value carries ends in its own newline and an
# empty value adds no line.
# Claude Code gives a plugin agent the session's file-writing and shell tools without any
# frontmatter key, so the value is empty.
AGENT_WRITE_TOOLS = { file = "slots/AGENT_WRITE_TOOLS.md" }
