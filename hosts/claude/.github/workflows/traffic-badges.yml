# This workflow runs only in the uHappyLogic/cairn-claude repository and does nothing in an
# installed copy of this plugin.

name: traffic-badges

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *' # daily at 03:17 UTC

permissions: {} # job token unused: the action reads the Traffic API and pushes with TRAFFIC_TOKEN

jobs:
  badges:
    runs-on: ubuntu-latest
    steps:
      - uses: albertoarena/github-traffic-badge@56f6f3e0ed586f14440561758b197ca57a38f480 # v1.1.4
        with:
          token: ${{ secrets.TRAFFIC_TOKEN }}
          metric: views-unique
          label: unique views
          color: 3b82f6
          style: flat
          output: views-unique.svg
      - uses: albertoarena/github-traffic-badge@56f6f3e0ed586f14440561758b197ca57a38f480 # v1.1.4
        with:
          token: ${{ secrets.TRAFFIC_TOKEN }}
          metric: clones-unique
          label: unique clones
          color: 3b82f6
          style: flat
          output: clones-unique.svg
